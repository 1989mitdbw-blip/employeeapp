<!DOCTYPE html>
<html lang="en">
<head>
 <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Employee Clock">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
<meta charset="UTF-8">

<title>Employee Clock</title>

<!-- Supabase JavaScript library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f4f6;
    color: #222;
}

.header {
    background: #fff;
    text-align: center;
    padding: 18px;
    border-bottom: 1px solid #ddd;
}

.header h1 { margin: 0; font-size: 30px; }
#currentTime { margin-top: 8px; font-size: 42px; font-weight: bold; }
#currentDate { margin-top: 4px; font-size: 18px; }

.container {
    max-width: 650px;
    margin: 25px auto;
    padding: 20px;
}

.card {
    background: #fff;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 3px 15px rgba(0,0,0,.08);
}

h2 { margin-top: 0; text-align: center; }

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 8px;
    font-size: 18px;
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 16px;
    font-size: 22px;
    border: 2px solid #ccc;
    border-radius: 10px;
    background: #fff;
}

button {
    width: 100%;
    padding: 18px;
    margin-top: 22px;
    border: 0;
    border-radius: 10px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled { opacity: .6; cursor: not-allowed; }

.primary { background: #222; color: #fff; }
.clock-in { background: #16803c; color: #fff; font-size: 30px; padding: 22px; }
.clock-out { background: #c62828; color: #fff; font-size: 30px; padding: 22px; }
.secondary { background: #e5e7eb; color: #222; }
.link-button { background: transparent; color: #2457c5; font-size: 17px; padding: 10px; margin-top: 12px; }

.message {
    min-height: 25px;
    margin-top: 15px;
    text-align: center;
    font-size: 19px;
}

.error { color: #c62828; }
.success { color: #16803c; }
.employee-name { margin: 20px 0; text-align: center; font-size: 32px; font-weight: bold; }
.status { margin: 15px 0; text-align: center; font-size: 20px; line-height: 1.6; }
.area-box { margin-top: 20px; }
.success-screen { padding: 35px 10px; text-align: center; }
.success-icon { font-size: 80px; }
.success-title { margin: 15px 0; font-size: 36px; font-weight: bold; }
.success-name { font-size: 28px; }
.success-time { margin-top: 20px; font-size: 42px; font-weight: bold; }
.terminal { margin-top: 18px; text-align: center; color: #777; font-size: 14px; }
.hidden { display: none !important; }

@media (max-width: 700px) {
    .container { margin: 10px auto; padding: 12px; }
    .card { padding: 22px; }
    #currentTime { font-size: 36px; }
}
</style>
</head>

<body>

<div class="header">
    <h1>Employee Clock</h1>
    <div id="currentTime">--:--:--</div>
    <div id="currentDate"></div>
</div>

<div class="container">

    <div id="loginScreen" class="card">
        <h2>Clock In / Clock Out</h2>

        <label for="loginMobile">Mobile Number</label>
        <input id="loginMobile" type="tel" inputmode="numeric" autocomplete="off" placeholder="04XXXXXXXX">

        <label for="loginPin">4-digit PIN</label>
        <input id="loginPin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••">

        <button id="continueButton" class="primary" onclick="employeeLogin()">CONTINUE</button>
        <div id="loginMessage" class="message"></div>

        <button class="link-button" onclick="showRegistration()">New Employee? Register</button>
        <div id="terminalDisplay" class="terminal"></div>
    </div>

    <div id="registrationScreen" class="card hidden">
        <h2>New Employee Registration</h2>

        <label for="firstName">First Name</label>
        <input id="firstName" type="text" autocomplete="off">

        <label for="lastName">Last Name</label>
        <input id="lastName" type="text" autocomplete="off">

        <label for="registerMobile">Mobile Number</label>
        <input id="registerMobile" type="tel" inputmode="numeric" autocomplete="off" placeholder="04XXXXXXXX">

        <label for="registerPin">Create 4-digit PIN</label>
        <input id="registerPin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••">

        <label for="confirmPin">Confirm PIN</label>
        <input id="confirmPin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••">

        <button id="registerButton" class="primary" onclick="registerEmployee()">REGISTER</button>
        <div id="registrationMessage" class="message"></div>
        <button class="secondary" onclick="returnHome()">BACK</button>
    </div>

    <div id="clockScreen" class="card hidden">
        <h2>Employee</h2>
        <div id="employeeName" class="employee-name"></div>
        <div id="employeeStatus" class="status"></div>

        <div id="areaSection" class="area-box">
            <label for="workArea">Select Work Area</label>
            <select id="workArea">
                <option value="">Select Work Area</option>
            </select>
        </div>

        <button id="clockInButton" class="clock-in hidden" onclick="clockIn()">CLOCK IN</button>
        <button id="clockOutButton" class="clock-out hidden" onclick="clockOut()">CLOCK OUT</button>
        <div id="clockMessage" class="message"></div>
        <button class="secondary" onclick="returnHome()">CANCEL</button>
    </div>

    <div id="successScreen" class="card hidden">
        <div class="success-screen">
            <div class="success-icon">✓</div>
            <div id="successTitle" class="success-title"></div>
            <div id="successName" class="success-name"></div>
            <div id="successTime" class="success-time"></div>
            <div id="successArea" class="status"></div>
            <div id="successTerminal" class="terminal"></div>
        </div>
    </div>

</div>

<script>
/* =========================
   SUPABASE CONNECTION
========================= */

const SUPABASE_URL = "https://ijrpubatuzfuyypjbwvu.supabase.co";
const SUPABASE_KEY = "sb_publishable_-tfiANrDO-vzGcZBSZx1Rg_xeMfCZAI";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


/* =========================
   TERMINAL
========================= */

const params = new URLSearchParams(window.location.search);
const TERMINAL_NAME = params.get("terminal") || "Main Entrance";

document.getElementById("terminalDisplay").textContent =
    "Terminal: " + TERMINAL_NAME;


/* =========================
   VARIABLES
========================= */

let currentEmployee = null;
let currentClockRecord = null;


/* =========================
   TABLET CLOCK
========================= */

function updateClock() {
    // new Date() is obtained from the tablet/device.
    const now = new Date();

    document.getElementById("currentTime").textContent =
        new Intl.DateTimeFormat("en-AU", {
            timeZone: "Australia/Melbourne",
            hour: "numeric",
            minute: "2-digit",
            second: "2-digit",
            hour12: true
        }).format(now);

    document.getElementById("currentDate").textContent =
        new Intl.DateTimeFormat("en-AU", {
            timeZone: "Australia/Melbourne",
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        }).format(now);
}

updateClock();
setInterval(updateClock, 1000);


/* =========================
   HELPERS
========================= */

function normaliseMobile(value) {
    return value.replace(/\D/g, "");
}

function formatMelbourneTime(timestamp) {
    return new Intl.DateTimeFormat("en-AU", {
        timeZone: "Australia/Melbourne",
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
    }).format(new Date(timestamp));
}

function hideAllScreens() {
    ["loginScreen", "registrationScreen", "clockScreen", "successScreen"]
        .forEach(id => document.getElementById(id).classList.add("hidden"));
}

function showRegistration() {
    hideAllScreens();
    document.getElementById("registrationScreen").classList.remove("hidden");
    document.getElementById("registrationMessage").textContent = "";
}

function returnHome() {
    currentEmployee = null;
    currentClockRecord = null;

    document.getElementById("loginMobile").value = "";
    document.getElementById("loginPin").value = "";
    document.getElementById("loginMessage").textContent = "";
    document.getElementById("clockMessage").textContent = "";

    hideAllScreens();
    document.getElementById("loginScreen").classList.remove("hidden");

    setTimeout(() => document.getElementById("loginMobile").focus(), 100);
}


/* =========================
   LOAD WORK AREAS
========================= */

async function loadWorkAreas() {
    const { data, error } = await db
        .from("work_areas")
        .select("id, area_name")
        .eq("active", true)
        .order("area_name");

    if (error) {
        console.error("Work area error:", error);
        return;
    }

    const select = document.getElementById("workArea");
    select.innerHTML = '<option value="">Select Work Area</option>';

    (data || []).forEach(area => {
        const option = document.createElement("option");
        option.value = area.id;
        option.textContent = area.area_name;
        select.appendChild(option);
    });
}


/* =========================
   REGISTER EMPLOYEE
========================= */

async function registerEmployee() {
    const button = document.getElementById("registerButton");
    const message = document.getElementById("registrationMessage");

    message.className = "message";
    message.textContent = "";

    const firstName = document.getElementById("firstName").value.trim();
    const lastName = document.getElementById("lastName").value.trim();
    const mobile = normaliseMobile(document.getElementById("registerMobile").value);
    const pin = document.getElementById("registerPin").value;
    const confirmPin = document.getElementById("confirmPin").value;

    if (!firstName || !lastName || !mobile || !pin || !confirmPin) {
        message.className = "message error";
        message.textContent = "Please complete all fields.";
        return;
    }

    if (!/^04\d{8}$/.test(mobile)) {
        message.className = "message error";
        message.textContent = "Enter a valid Australian mobile number.";
        return;
    }

    if (!/^\d{4}$/.test(pin)) {
        message.className = "message error";
        message.textContent = "PIN must contain exactly 4 numbers.";
        return;
    }

    if (pin !== confirmPin) {
        message.className = "message error";
        message.textContent = "PINs do not match.";
        return;
    }

    button.disabled = true;
    button.textContent = "REGISTERING...";

    const { error } = await db
        .from("employees")
        .insert({
            first_name: firstName,
            last_name: lastName,
            mobile: mobile,
            pin: pin,
            active: true
        });

    button.disabled = false;
    button.textContent = "REGISTER";

    if (error) {
        console.error("Registration error:", error);
        message.className = "message error";

        if (error.code === "23505") {
            message.textContent = "This mobile number is already registered.";
        } else {
            message.textContent = "Registration failed: " + error.message;
        }
        return;
    }

    document.getElementById("firstName").value = "";
    document.getElementById("lastName").value = "";
    document.getElementById("registerMobile").value = "";
    document.getElementById("registerPin").value = "";
    document.getElementById("confirmPin").value = "";

    returnHome();

    document.getElementById("loginMobile").value = mobile;
    document.getElementById("loginMessage").className = "message success";
    document.getElementById("loginMessage").textContent =
        "Registration successful. Enter your PIN.";
}


/* =========================
   LOGIN
========================= */

async function employeeLogin() {
    const button = document.getElementById("continueButton");
    const message = document.getElementById("loginMessage");

    message.className = "message";
    message.textContent = "";

    const mobile = normaliseMobile(document.getElementById("loginMobile").value);
    const pin = document.getElementById("loginPin").value;

    if (!mobile || !pin) {
        message.className = "message error";
        message.textContent = "Enter mobile number and PIN.";
        return;
    }

    button.disabled = true;
    button.textContent = "CHECKING...";

    const { data, error } = await db
        .from("employees")
        .select("id, first_name, last_name, mobile, active")
        .eq("mobile", mobile)
        .eq("pin", pin)
        .eq("active", true)
        .maybeSingle();

    button.disabled = false;
    button.textContent = "CONTINUE";

    if (error) {
        console.error("Login error:", error);
        message.className = "message error";
        message.textContent = "Unable to connect to the database.";
        return;
    }

    if (!data) {
        message.className = "message error";
        message.textContent = "Mobile number or PIN is incorrect.";
        return;
    }

    currentEmployee = data;
    await checkEmployeeStatus();
}


/* =========================
   CHECK CLOCK STATUS
========================= */

async function checkEmployeeStatus() {
    const { data, error } = await db
        .from("clock_records")
        .select(`
            id,
            employee_id,
            work_area_id,
            clock_in,
            clock_out,
            clock_in_terminal,
            work_areas (
                area_name
            )
        `)
        .eq("employee_id", currentEmployee.id)
        .is("clock_out", null)
        .order("clock_in", { ascending: false })
        .limit(1)
        .maybeSingle();

    if (error) {
        console.error("Clock status error:", error);
        document.getElementById("loginMessage").className = "message error";
        document.getElementById("loginMessage").textContent =
            "Unable to check clock status.";
        return;
    }

    currentClockRecord = data;
    showClockScreen();
}


/* =========================
   CLOCK SCREEN
========================= */

function showClockScreen() {
    hideAllScreens();
    document.getElementById("clockScreen").classList.remove("hidden");

    document.getElementById("employeeName").textContent =
        currentEmployee.first_name + " " + currentEmployee.last_name;

    const status = document.getElementById("employeeStatus");
    const areaSection = document.getElementById("areaSection");
    const clockInButton = document.getElementById("clockInButton");
    const clockOutButton = document.getElementById("clockOutButton");

    document.getElementById("clockMessage").textContent = "";

    if (currentClockRecord) {
        areaSection.classList.add("hidden");
        clockInButton.classList.add("hidden");
        clockOutButton.classList.remove("hidden");

        const area = currentClockRecord.work_areas?.area_name || "";

        status.innerHTML =
            "Currently Clocked In" +
            "<br><strong>" + area + "</strong>" +
            "<br>Started: " + formatMelbourneTime(currentClockRecord.clock_in);
    } else {
        status.textContent = "You are currently clocked out.";
        areaSection.classList.remove("hidden");
        clockInButton.classList.remove("hidden");
        clockOutButton.classList.add("hidden");
        document.getElementById("workArea").value = "";
    }
}


/* =========================
   CLOCK IN
========================= */

async function clockIn() {
    const areaId = document.getElementById("workArea").value;
    const message = document.getElementById("clockMessage");
    const button = document.getElementById("clockInButton");

    if (!areaId) {
        message.className = "message error";
        message.textContent = "Please select a work area.";
        return;
    }

    button.disabled = true;
    button.textContent = "CLOCKING IN...";

    // IMPORTANT: attendance time comes from the tablet.
    const tabletTime = new Date();
    const clockInTimestamp = tabletTime.toISOString();

    const { data, error } = await db
        .from("clock_records")
        .insert({
            employee_id: currentEmployee.id,
            work_area_id: Number(areaId),
            clock_in: clockInTimestamp,
            clock_in_terminal: TERMINAL_NAME
        })
        .select(`
            id,
            clock_in,
            work_area_id,
            work_areas (
                area_name
            )
        `)
        .single();

    button.disabled = false;
    button.textContent = "CLOCK IN";

    if (error) {
        console.error("Clock in error:", error);
        message.className = "message error";

        if (error.code === "23505") {
            message.textContent = "You are already clocked in.";
        } else {
            message.textContent = "Clock in failed: " + error.message;
        }
        return;
    }

    showSuccess(
        "CLOCKED IN",
        data.clock_in,
        data.work_areas?.area_name || ""
    );
}


/* =========================
   CLOCK OUT
========================= */

async function clockOut() {
    if (!currentClockRecord) return;

    const button = document.getElementById("clockOutButton");
    const message = document.getElementById("clockMessage");

    button.disabled = true;
    button.textContent = "CLOCKING OUT...";

    // IMPORTANT: attendance time comes from the tablet.
    const tabletTime = new Date();
    const clockOutTimestamp = tabletTime.toISOString();

    const { data, error } = await db
        .from("clock_records")
        .update({
            clock_out: clockOutTimestamp,
            clock_out_terminal: TERMINAL_NAME
        })
        .eq("id", currentClockRecord.id)
        .is("clock_out", null)
        .select("id, clock_out")
        .maybeSingle();

    button.disabled = false;
    button.textContent = "CLOCK OUT";

    if (error) {
        console.error("Clock out error:", error);
        message.className = "message error";
        message.textContent = "Clock out failed: " + error.message;
        return;
    }

    if (!data) {
        message.className = "message error";
        message.textContent = "This shift has already been clocked out.";
        return;
    }

    showSuccess(
        "CLOCKED OUT",
        data.clock_out,
        currentClockRecord.work_areas?.area_name || ""
    );
}


/* =========================
   SUCCESS
========================= */

function showSuccess(action, timestamp, area) {
    hideAllScreens();
    document.getElementById("successScreen").classList.remove("hidden");

    document.getElementById("successTitle").textContent = action;
    document.getElementById("successName").textContent =
        currentEmployee.first_name + " " + currentEmployee.last_name;
    document.getElementById("successTime").textContent =
        formatMelbourneTime(timestamp);
    document.getElementById("successArea").textContent = area;
    document.getElementById("successTerminal").textContent =
        "Terminal: " + TERMINAL_NAME;

    // Reset for next employee after 2 seconds.
    setTimeout(returnHome, 2000);
}


/* =========================
   INPUT BEHAVIOUR
========================= */

document.getElementById("loginPin").addEventListener("keydown", event => {
    if (event.key === "Enter") employeeLogin();
});

function numericPinOnly(element) {
    element.addEventListener("input", function() {
        this.value = this.value.replace(/\D/g, "").slice(0, 4);
    });
}

numericPinOnly(document.getElementById("loginPin"));
numericPinOnly(document.getElementById("registerPin"));
numericPinOnly(document.getElementById("confirmPin"));


/* =========================
   START
========================= */

loadWorkAreas();
returnHome();

</script>

</body>
</html>
